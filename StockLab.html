  <div class="mobile-market-tabs"><button data-action="mobile-pane" data-value="trade" class="${state.mobilePane==='trade'?'active':''}">차트 · 주문</button><button data-action="mobile-pane" data-value="list" class="${state.mobilePane==='list'?'active':''}">${icon('search')} 종목 탐색 <span>300</span></button></div>
  <div class="market-layout mobile-${state.mobilePane}">
    <section class="panel stock-panel"><div class="panel-heading"><h2>시장 탐색 <span>300</span></h2><button class="icon-button ${state.watchOnly?'accent':''}" data-action="watch-filter" aria-label="관심 종목만 보기" aria-pressed="${state.watchOnly}">${icon('star')}</button></div><div class="list-controls"><label class="search-field">${icon('search')}<input type="search" id="stock-search" value="${esc(state.query)}" placeholder="종목명 또는 코드 검색" aria-label="종목명 또는 코드 검색" autocomplete="off"></label><div class="segmented market-filter" aria-label="시장 필터">${[['all','전체'],['KR','한국형'],['US','미국형']].map(([v,l])=>`<button data-action="market-filter" data-value="${v}" class="${state.market===v?'active':''}" aria-pressed="${state.market===v}">${l}</button>`).join('')}</div><div class="list-selects"><select id="sector-filter" aria-label="업종 필터"><option value="all">모든 업종</option>${SECTORS.map(([n],i)=>`<option value="${i}" ${String(state.sector)===String(i)?'selected':''}>${n}</option>`).join('')}</select><select id="stock-sort" aria-label="종목 정렬">${[['default','기본 순'],['up','상승률 순'],['down','하락률 순'],['cap','규모 순']].map(([v,l])=>`<option value="${v}" ${state.sort===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="list-column-label"><span id="stock-count"></span><span>현재가 / 등락률</span></div><div id="stock-rows" class="stock-rows"></div><div id="list-pagination" class="list-pagination"></div></section>
    <section class="panel chart-panel"><div class="stock-heading"><div class="stock-identity">${stockMark(s)}<div><div class="stock-meta">${s.id} <span>·</span> ${s.market==='KR'?'한국형':'미국형'} <span>·</span> ${SECTORS[s.sector][0]}</div><h2>${esc(s.name)}</h2></div></div><button class="icon-button ${a?.watchlist.includes(s.id)?'accent':''}" data-action="watch" data-id="${s.id}" aria-label="${esc(s.name)} 관심 종목 ${a?.watchlist.includes(s.id)?'해제':'등록'}" aria-pressed="${!!a?.watchlist.includes(s.id)}">${icon('star')}</button></div><div class="price-heading"><strong data-live-price="${s.id}">${money(q.price,s.currency)}</strong><span data-live-change="${s.id}" class="${signClass(q.change)}">${pct(q.change)}</span><span class="muted">가상 당일 대비</span></div><div class="chart-toolbar"><div class="range-tabs">${['1D','1W','1M','3M'].map((v,i)=>`<button data-action="range" data-value="${v}" class="${state.range===v?'active':''}" aria-pressed="${state.range===v}">${['1일','1주','1개월','3개월'][i]}</button>`).join('')}</div><div class="chart-kind"><button data-action="chart-type" data-value="candle" class="${state.chartType==='candle'?'active':''}" aria-pressed="${state.chartType==='candle'}">캔들</button><button data-action="chart-type" data-value="line" class="${state.chartType==='line'?'active':''}" aria-pressed="${state.chartType==='line'}">라인</button></div></div><div id="stock-chart" class="chart-wrap">${candleChart(candles(s,state.range,state.now),s.currency,state.chartType)}</div><div class="chart-caption"><span>가상 시간 기준 · 생성 거래량</span><span>캔들에 마우스를 올리면 상세 가격 표시</span></div><div class="company-metrics"><div><span>가상 기업 규모</span><strong>${s.cap}조 원</strong></div><div><span>가상 PER</span><strong>${s.pe}배</strong></div><div><span>변동성</span><strong class="${s.risk==='높음'?'up':''}">${s.risk}</strong></div><div><span>시장 민감도</span><strong>${num(s.beta,2)}</strong></div></div><div class="company-note">${icon('info')}<span>${SECTORS[s.sector][0]} 업종의 가상 기업입니다. 기업 정보는 학습용 설정값입니다.</span></div></section>
    <section class="panel order-panel"><div class="panel-heading"><h2>주문하기</h2><span class="mini-label">PAPER TRADE</span></div><div class="order-body"><div class="side-toggle"><button data-action="side" data-value="buy" class="${state.side==='buy'?'active buy':''}" aria-pressed="${state.side==='buy'}">매수</button><button data-action="side" data-value="sell" class="${state.side==='sell'?'active sell':''}" aria-pressed="${state.side==='sell'}">매도</button></div><form id="order-form"><label class="field-label" for="order-type">주문 방식 <button type="button" class="inline-help" data-action="order-help" aria-label="시장가와 지정가 설명">?</button></label><select id="order-type" name="type"><option value="market">시장가 · 현재 가격에 주문</option><option value="limit">지정가 · 원하는 가격에 주문</option></select><div id="limit-field" hidden><label class="field-label" for="limit-price">지정 가격 (${s.currency==='KRW'?'원':'달러'})</label><input id="limit-price" name="limitPrice" type="number" inputmode="decimal" min="${s.currency==='KRW'?1:.01}" step="${s.currency==='KRW'?1:.01}" value="${q.price}"></div><label class="field-label" for="order-qty">주문 수량 <span>온주 거래</span></label><div class="quantity-input"><button type="button" data-action="qty-minus" aria-label="수량 1주 줄이기">−</button><input id="order-qty" name="qty" type="number" inputmode="numeric" min="1" max="1000000" step="1" value="1" aria-label="주문 수량"><span>주</span><button type="button" data-action="qty-plus" aria-label="수량 1주 늘리기">+</button></div><div class="quantity-presets">${[25,50,100].map(p=>`<button type="button" data-action="qty-percent" data-value="${p}">${p===100?'최대':p+'%'}</button>`).join('')}</div><div id="order-estimate" class="order-estimate"></div><button class="order-submit ${state.side}" type="submit" ${state.busy?'disabled':''}>${a?(state.side==='buy'?'매수 주문':'매도 주문'):'로그인하고 모의투자 시작'} ${icon('arrow')}</button><p class="order-footnote">매매 수수료 0.05% · 세금 미반영<br>지정가는 가상 당일까지만 유효합니다.</p></form><div class="order-tip"><span>LEARNING TIP</span><p>가격보다 먼저,<br><strong>매매의 이유를 생각해보세요.</strong></p><a href="#learn">주문 방법 배우기 ${icon('arrow')}</a></div></div></section>
  </div><div class="below-market"><section class="panel news-panel"><div class="panel-heading"><h2>시장을 움직이는 이야기</h2><span class="mini-label">가상 뉴스</span></div><div class="news-grid" id="news-list">${newsMarkup()}</div></section><section class="learning-banner"><div class="eyebrow">LEARN BY DOING</div><h2>수익률보다 중요한 건,<br>나만의 판단을 쌓는 일.</h2><p>주문의 이유를 기록하고, 결과를 돌아보세요.</p><a href="#journal">매매일지 열기 ${icon('arrow')}</a><span class="banner-decoration" aria-hidden="true">↗</span></section></div>`;}
function newsMarkup(){return marketNews(state.now).map(e=>`<article class="news-item"><div><span class="news-category">${e.market==='KR'?'한국형':'미국형'} · ${SECTORS[e.sector][0]}</span><span class="muted">${simLabel(e.at)}</span></div><h3><span class="news-dot ${e.positive?'positive':'negative'}"></span>${e.title}</h3><p>${e.detail}</p></article>`).join('');}
function filteredStocks(){const query=state.query.trim().toLowerCase();let list=STOCKS.filter(s=>(state.market==='all'||s.market===state.market)&&(state.sector==='all'||s.sector===Number(state.sector))&&(!state.watchOnly||account()?.watchlist.includes(s.id))&&(!query||(s.name+' '+s.id+' '+SECTORS[s.sector][0]).toLowerCase().includes(query)));if(state.sort==='up'||state.sort==='down')list.sort((a,b)=>(quote(b,state.now).change-quote(a,state.now).change)*(state.sort==='up'?1:-1));if(state.sort==='cap')list.sort((a,b)=>b.cap-a.cap);return list;}
function renderStockRows(){if(!$('#stock-rows'))return;const list=filteredStocks(),pages=Math.max(1,Math.ceil(list.length/12));state.page=Math.min(state.page,pages-1);$('#stock-count').textContent=`${state.watchOnly?'관심 종목':'종목'} ${list.length}개`;$('#stock-rows').innerHTML=list.length?list.slice(state.page*12,state.page*12+12).map(s=>{const q=quote(s,state.now);return `<button class="stock-row ${s.id===state.selected?'selected':''}" data-action="select-stock" data-id="${s.id}" aria-label="${esc(s.name)} ${money(q.price,s.currency)} ${pct(q.change)}" aria-pressed="${s.id===state.selected}">${stockMark(s)}<span class="stock-row-name"><strong>${esc(s.name)}</strong><small>${s.id} · ${SECTORS[s.sector][0]}</small></span><span class="stock-row-value"><strong data-live-price="${s.id}">${money(q.price,s.currency)}</strong><small class="${signClass(q.change)}" data-live-change="${s.id}">${pct(q.change)}</small></span></button>`;}).join(''):`<div class="empty-list">${icon('search')}<p>${state.watchOnly?'관심 종목이 없습니다.':'검색 결과가 없습니다.'}</p><small>${state.watchOnly?'종목 옆 별을 눌러 추가하세요.':'종목명, 코드 또는 필터를 확인해주세요.'}</small></div>`;$('#list-pagination').innerHTML=`<button data-action="page-prev" ${state.page===0?'disabled':''} aria-label="이전 종목 페이지">←</button><span>${state.page+1} <i>/ ${pages}</i></span><button data-action="page-next" ${state.page>=pages-1?'disabled':''} aria-label="다음 종목 페이지">→</button>`;}
function updateEstimate(){if(!$('#order-estimate'))return;const s=selected(),a=account(),type=$('#order-type').value,price=type==='limit'?Number($('#limit-price').value):priceAt(s,state.now),qty=Number($('#order-qty').value);const gross=Number.isFinite(price*qty)?Math.max(0,toMinor(price,s.currency)*qty):0,fee=feeFor(gross);$('#order-estimate').innerHTML=`<div><span>주문 가능 ${state.side==='buy'?'금액':'수량'}</span><strong>${a?(state.side==='buy'?minor(availableCash(a,s.currency),s.currency):num(availableShares(a,s.id))+'주'):'로그인 후 확인'}</strong></div><div><span>예상 거래 금액</span><span>${minor(gross,s.currency)}</span></div><div><span>예상 수수료</span><span>${minor(fee,s.currency)}</span></div><div class="estimate-total"><span>${state.side==='buy'?'총 주문 금액':'예상 수령액'}</span><strong>${minor(state.side==='buy'?gross+fee:Math.max(0,gross-fee),s.currency)}</strong></div>${s.currency==='USD'?'<button class="text-button full" type="button" data-action="exchange">원화 ↔ 달러 환전 '+icon('exchange')+'</button>':''}`;}
function needsAccount(title,description){return `<section class="account-empty panel"><div class="empty-emblem">${icon('portfolio')}</div><span class="eyebrow">START YOUR INVESTING JOURNEY</span><h2>${title}</h2><p>${description}<br>가상 자금 1,000만 원으로 시작할 수 있습니다.</p><button class="primary" data-action="signup">내 투자 프로필 만들기 ${icon('arrow')}</button><button class="text-button" data-action="auth">이미 프로필이 있어요</button><small>아이디·비밀번호로 구분하며, 기록은 현재 브라우저에 저장됩니다.</small></section>`;}
function portfolioPage(){const a=account();if(!a)return pageHeading('MY PORTFOLIO','내 자산','내가 쌓아가는 투자 기록, 한눈에 살펴보세요.')+needsAccount('첫 번째 포트폴리오를 만들어보세요.','가상의 돈으로 매수와 매도, 자금 배분을 경험해보세요.');const p=portfolio(a,state.now),pending=a.orders.filter(o=>o.status==='pending');return `${pageHeading('MY PORTFOLIO','내 자산','현금부터 보유 종목까지, 투자 현황을 한눈에.',`<button class="secondary" data-action="exchange">${icon('exchange')} 가상 환전</button>`)}<section class="asset-summary"><div class="asset-main"><span>총 평가자산 <small>원화 환산</small></span><strong>${money(p.total)}</strong><div class="${signClass(p.profit)}">${p.profit>0?'+':''}${money(p.profit)} <span>${pct(p.percent)}</span></div><small>시작 자금 ${money(a.initialCapital)} · 가상 환율 ${num(p.fx,2)}원</small></div><div class="asset-stat"><span>주문 가능 원화</span><strong>${minor(availableCash(a,'KRW'),'KRW')}</strong><small>예약 ${minor(a.cash.KRW-availableCash(a,'KRW'),'KRW')}</small></div><div class="asset-stat"><span>주문 가능 달러</span><strong>${minor(availableCash(a,'USD'),'USD')}</strong><small>예약 ${minor(a.cash.USD-availableCash(a,'USD'),'USD')}</small></div><div class="asset-stat"><span>평가손익</span><strong class="${signClass(p.unrealized)}">${money(p.unrealized)}</strong><small>매도 수수료 차감 전</small></div></section><div class="portfolio-top-grid"><section class="panel"><div class="panel-heading"><h2>나의 자산 흐름</h2><span class="mini-label">접속 중 기록</span></div><div class="equity-wrap">${equityChart(a.equity,a.initialCapital)}</div></section><section class="panel allocation-panel"><div class="panel-heading"><h2>자산 배분</h2><span class="mini-label">현재 평가액</span></div>${allocationMarkup(p)}</section></div><section class="panel holdings-panel"><div class="panel-heading"><h2>보유 종목 <span>${p.holdings.length}</span></h2><span class="mini-label">종목 수익률은 해당 통화 기준</span></div>${p.holdings.length?`<div class="table-scroll"><table><thead><tr><th>종목</th><th>보유 수량</th><th>평균 매입가</th><th>현재가</th><th>평가금액</th><th>평가손익</th><th></th></tr></thead><tbody>${p.holdings.map(h=>`<tr><td><button class="table-stock" data-action="select-stock" data-id="${h.stock.id}">${stockMark(h.stock)}<span><strong>${h.stock.name}</strong><small>${h.stock.id}</small></span></button></td><td>${num(h.qty)}주</td><td>${minor(h.cost/h.qty,h.stock.currency)}</td><td>${minor(h.price,h.stock.currency)}</td><td>${minor(h.value,h.stock.currency)}</td><td class="${signClass(h.profit)}"><strong>${minor(h.profit,h.stock.currency)}</strong><small>${pct(h.percent)}</small></td><td><button class="small-button" data-action="sell-stock" data-id="${h.stock.id}">매도</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty-inline"><p>아직 보유한 종목이 없습니다.</p><a href="#market" class="text-button">첫 종목 살펴보기 ${icon('arrow')}</a></div>`}</section><section class="panel pending-panel"><div class="panel-heading"><h2>대기 중인 주문 <span>${pending.length}</span></h2><span class="mini-label">당일 만료 · 재접속 시 누락 구간 계산</span></div>${pending.length?`<div class="pending-list">${pending.map(o=>`<div class="pending-item"><span class="trade-side ${o.side}">${o.side==='buy'?'매수':'매도'}</span><div><strong>${STOCK_MAP.get(o.stockId).name}</strong><small>${num(o.qty)}주 · ${minor(o.limitMinor,o.currency)} 지정가</small></div><span class="muted">${simLabel(o.createdAt)}</span><button class="small-button" data-action="cancel-order" data-id="${o.id}">취소</button></div>`).join('')}</div>`:'<div class="empty-inline"><p>대기 중인 주문이 없습니다.</p></div>'}</section><section class="panel"><div class="panel-heading"><h2>최근 거래 내역</h2><button class="text-button" data-action="csv">${icon('download')} CSV</button></div>${tradeTable(a.trades.slice(-15).reverse())}</section><section class="panel"><div class="panel-heading"><h2>환전 내역 <span>${a.exchanges.length}</span></h2><span class="mini-label">가상 환전 스프레드 0.1%</span></div>${a.exchanges.length?`<div class="table-scroll"><table><thead><tr><th>가상 시각</th><th>방향</th><th>환전한 금액</th><th>받은 금액</th><th>기준 환율</th></tr></thead><tbody>${a.exchanges.slice(-10).reverse().map(e=>`<tr><td>${simLabel(e.at)}</td><td>${e.direction==='toUSD'?'원화 → 달러':'달러 → 원화'}</td><td>${minor(e.debit,e.direction==='toUSD'?'KRW':'USD')}</td><td>${minor(e.credit,e.direction==='toUSD'?'USD':'KRW')}</td><td>${num(e.rate,2)}원</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-inline"><p>환전 내역이 없습니다.</p></div>'}</section>`;}
function allocationMarkup(p){const items=[{name:'현금',value:p.cash,color:'#a3a6ac'},...SECTORS.map(([name,,color],i)=>({name,value:p.holdings.filter(h=>h.stock.sector===i).reduce((n,h)=>n+h.krw,0),color}))].filter(x=>x.value>0).sort((a,b)=>b.value-a.value);return `<div class="allocation-bar">${items.map(x=>`<span style="width:${x.value/p.total*100}%;background:${x.color}" title="${x.name} ${num(x.value/p.total*100,1)}%"></span>`).join('')}</div><div class="allocation-legend">${items.map(x=>`<div><span><i style="background:${x.color}"></i>${x.name}</span><strong>${num(x.value/p.total*100,1)}%</strong></div>`).join('')}</div>`;}
function tradeTable(trades){return trades.length?`<div class="table-scroll"><table><thead><tr><th>가상 시각</th><th>종목</th><th>구분</th><th>수량</th><th>체결가</th><th>수수료</th><th>실현손익</th></tr></thead><tbody>${trades.map(t=>`<tr><td>${simLabel(t.at)}</td><td>${STOCK_MAP.get(t.stockId).name}</td><td><span class="trade-side ${t.side}">${t.side==='buy'?'매수':'매도'}</span></td><td>${num(t.qty)}주</td><td>${minor(t.priceMinor,t.currency)}</td><td>${minor(t.fee,t.currency)}</td><td class="${signClass(t.realized)}">${t.side==='sell'?minor(t.realized,t.currency):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-inline"><p>첫 주문이 체결되면 이곳에 거래 내역이 쌓입니다.</p></div>';}
function journalPage(){const a=account();if(!a)return pageHeading('REFLECT & GROW','매매일지','수익과 손실 너머, 내 판단을 돌아보는 시간.')+needsAccount('거래의 이유를 기록해보세요.','매매마다 생각과 감정을 남기고 나의 투자 습관을 발견하세요.');const noted=a.trades.filter(t=>a.journal[t.id]?.text).length;return `${pageHeading('REFLECT & GROW','매매일지','결과만 보지 말고, 그때의 생각을 함께 기록하세요.',`<button class="secondary" data-action="csv">${icon('download')} 거래 내역 내보내기</button>`)}<div class="journal-overview"><div><span>체결된 거래</span><strong>${a.trades.length}<small>건</small></strong></div><div><span>남긴 기록</span><strong>${noted}<small>개</small></strong></div><p>“왜 샀는지, 어떤 변화를 예상했는지,<br>다음에는 무엇을 다르게 할지.”</p></div>${a.trades.length?`<div class="journal-list">${a.trades.slice().reverse().map(t=>{const s=STOCK_MAP.get(t.stockId),j=a.journal[t.id]||{};return `<article class="panel journal-card"><div class="journal-trade"><div class="stock-identity">${stockMark(s)}<div><span class="stock-meta">${simLabel(t.at)} · ${new Date(t.at).toLocaleDateString('ko-KR')}</span><h2>${s.name}</h2></div></div><span class="trade-side ${t.side}">${t.side==='buy'?'매수':'매도'}</span><div class="journal-trade-price"><strong>${num(t.qty)}주 × ${minor(t.priceMinor,t.currency)}</strong><small>${t.side==='sell'?'실현손익 '+minor(t.realized,t.currency):'수수료 '+minor(t.fee,t.currency)}</small></div></div><form class="journal-form" data-trade-id="${t.id}"><label class="field-label" for="journal-${t.id}">이 거래에서 무엇을 배웠나요?</label><textarea id="journal-${t.id}" name="text" rows="3" maxlength="2000" placeholder="매매 이유, 예상한 흐름, 결과와의 차이를 남겨보세요.">${esc(j.text||t.note||'')}</textarea><div><label>당시의 마음 <select name="feeling" aria-label="거래 당시 감정"><option value="calm" ${j.feeling==='calm'?'selected':''}>차분했어요</option><option value="confident" ${j.feeling==='confident'?'selected':''}>확신이 있었어요</option><option value="hurried" ${j.feeling==='hurried'?'selected':''}>조급했어요</option><option value="anxious" ${j.feeling==='anxious'?'selected':''}>불안했어요</option></select></label><button class="secondary" type="submit">${j.text?icon('check'):'+'} 기록 저장</button></div></form></article>`;}).join('')}</div>`:`<section class="panel empty-inline large"><div class="empty-emblem">${icon('journal')}</div><h2>아직 거래 기록이 없습니다.</h2><p>주문이 체결되면 매매일지를 작성할 수 있습니다.</p><a href="#market" class="primary">종목 둘러보기 ${icon('arrow')}</a></section>`}`;}
function learnPage(){const done=account()?.lessons||[],lesson=LESSONS.find(l=>l.id===state.lesson)||LESSONS[0],answer=state.quiz[lesson.id];return `${pageHeading('A LITTLE KNOWLEDGE, EVERY DAY','학습 노트','한 번에 하나씩. 직접 거래하면서 익히는 투자 기초.',`<div class="lesson-progress"><strong>${done.length} <span>/ ${LESSONS.length}</span></strong><small>학습 완료</small></div>`)}<div class="learn-layout"><div class="lesson-menu">${LESSONS.map(l=>`<button class="lesson-menu-item ${l.id===lesson.id?'active':''}" data-action="lesson" data-id="${l.id}"><span>${l.tag}</span><strong>${l.title}</strong><small>${done.includes(l.id)?icon('check')+' 학습 완료':l.minutes+'분 읽기'} ${icon('chevron')}</small></button>`).join('')}</div><article class="panel lesson-article"><div class="eyebrow">${lesson.tag}</div><h2>${lesson.title}</h2><p class="lesson-intro">${lesson.intro}</p>${lesson.sections.map(([h,p])=>`<section><h3>${h}</h3><p>${p}</p></section>`).join('')}<div class="quiz"><span class="eyebrow">QUICK CHECK</span><h3>${lesson.question}</h3><div class="quiz-answers">${lesson.answers.map((text,i)=>`<button data-action="quiz" data-id="${lesson.id}" data-value="${i}" class="${answer===i?(i===lesson.correct?'correct':'incorrect'):''}"><span>${String.fromCharCode(65+i)}</span>${text}${answer===i?icon(i===lesson.correct?'check':'close'):''}</button>`).join('')}</div>${answer!==undefined?`<p class="quiz-explanation ${answer===lesson.correct?'correct':''}">${answer===lesson.correct?'정답이에요. ':'다시 생각해보세요. '}${lesson.explanation}</p>`:''}</div><div class="lesson-bottom"><small>모의시장 규칙과 실제 시장의 차이를 함께 확인하세요.</small><button class="text-button" data-action="rules">이용 안내 ${icon('arrow')}</button></div></article></div>`;}

async function commit(mutator,message=''){
  if(!state.session){openAuth();return false;}if(state.busy)return false;
  state.busy=true;
  try {const next=mutator(structuredClone(account()));await saveProfile(state.session,next);state.busy=false;render();if(message)toast(message);return true;}
  catch(e){state.busy=false;toast(e.message,true);return false;}
}
function showModal(title,body,wide=false){const d=$('#modal');d.className=wide?'wide':'';d.innerHTML=`<div class="modal-heading"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="창 닫기">${icon('close')}</button></div><div class="modal-body">${body}</div>`;if(!d.open)d.showModal();document.body.classList.add('modal-open');}
function closeModal(){if(state.busy)return;$('#modal').close();document.body.classList.remove('modal-open');}

  showModal('내 투자 프로필',`<div class="auth-intro"><span class="brand-mark">${icon('chart')}</span><h3>실수는 경험이 되고,<br>경험은 감각이 됩니다.</h3><p>가상 자금 1,000만 원으로 시작하세요.</p></div><div class="segmented auth-tabs"><button data-action="auth" class="${mode==='login'?'active':''}">로그인</button><button data-action="signup" class="${mode==='signup'?'active':''}">프로필 만들기</button></div><form id="auth-form" data-mode="${mode}"><label class="field-label" for="auth-username">아이디</label><input id="auth-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20" placeholder="영문·숫자·밑줄 3~20자" required><label class="field-label" for="auth-password">비밀번호</label><input id="auth-password" name="password" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" minlength="8" maxlength="128" placeholder="8자 이상" required>${mode==='signup'?'<label class="field-label" for="auth-confirm">비밀번호 확인</label><input id="auth-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>':''}<p class="form-error" id="auth-error" role="alert"></p><button class="primary full" type="submit">${mode==='signup'?'1,000만 원으로 시작하기':'내 투자 기록 열기'} ${icon('arrow')}</button></form><div class="local-notice">${icon('shield')}<p>이 브라우저에 저장되는 개인 프로필입니다. 다른 기기에서는 암호화 백업을 복원해주세요. 비밀번호를 잊으면 복구할 수 없습니다.</p></div><button class="text-button full" data-action="import">${icon('download')} 백업 파일로 복원하기</button>`);
  setTimeout(()=>$('#auth-username')?.focus(),30);
}
function openExchange(){if(!account()){openAuth();return;}showModal('가상 환전',`<p class="modal-description">미국형 주식을 거래할 달러를 준비하세요.<br>현재 가상 환율 <strong id="fx-rate">${num(fxRate(state.now),2)}원</strong> / USD</p><form id="exchange-form"><label class="field-label" for="fx-direction">환전 방향</label><select id="fx-direction" name="direction"><option value="toUSD">원화 → 달러</option><option value="toKRW">달러 → 원화</option></select><label class="field-label" for="fx-amount">환전할 금액</label><input id="fx-amount" name="amount" type="number" inputmode="decimal" min="1" step="1" value="1000000" required><div id="fx-estimate" class="order-estimate"></div><p class="form-error" id="fx-error" role="alert"></p><button class="primary full" type="submit">환전하기 ${icon('exchange')}</button><p class="field-hint">양방향 스프레드 0.1% · 실제 환율과 무관한 가상 거래</p></form>`);updateFxEstimate();}
function updateFxEstimate(){if(!$('#fx-estimate'))return;const direction=$('#fx-direction').value,amount=Math.max(0,Number($('#fx-amount').value)||0),rate=fxRate(state.now),credit=direction==='toUSD'?Math.floor(amount/(rate*(1+FX_SPREAD))*100)/100:Math.floor(amount*rate*(1-FX_SPREAD));$('#fx-rate').textContent=num(rate,2)+'원';$('#fx-estimate').innerHTML=`<div><span>환전 가능</span><strong>${minor(availableCash(account(),direction==='toUSD'?'KRW':'USD'),direction==='toUSD'?'KRW':'USD')}</strong></div><div class="estimate-total"><span>예상 수령액</span><strong>${money(credit,direction==='toUSD'?'USD':'KRW')}</strong></div>`;}
function openSettings(){if(!account()){openAuth();return;}showModal('내 프로필',`<div class="profile-summary">${icon('user')}<div><strong>${esc(account().username)}</strong><span>현재 브라우저에 암호화 저장</span></div></div><div class="settings-note">브라우저 데이터를 지우면 기록도 사라집니다. 중요한 거래 기록은 백업해두세요. 비밀번호는 백업에도 필요합니다.</div><div class="settings-actions"><button class="secondary" data-action="export">${icon('download')} 암호화 백업 다운로드</button><button class="secondary" data-action="import">${icon('portfolio')} 백업 파일 복원</button><button class="secondary" data-action="reset">${icon('exchange')} 가상 계좌 초기화</button><button class="secondary" data-action="logout">${icon('logout')} 로그아웃</button></div>`);}
function openImport(){showModal('암호화 백업 복원',`<p class="modal-description">다른 기기의 백업 파일을 가져와 이어서 연습하세요.<br>백업할 때 사용했던 비밀번호가 필요합니다.</p><form id="import-form"><label class="field-label" for="backup-file">Stock Lab 백업 파일</label><input id="backup-file" type="file" accept=".json,application/json" required><label class="field-label" for="backup-password">백업 비밀번호</label><input id="backup-password" name="password" type="password" autocomplete="current-password" required><label class="checkbox-label"><input type="checkbox" name="replace">같은 아이디가 있으면 현재 기록을 백업 내용으로 덮어씁니다.</label><p class="form-error" id="import-error" role="alert"></p><button class="primary full" type="submit">백업 복원하기</button></form>`);}
function openRules(){showModal('모의시장 이용 안내',`<div class="rules-content"><span class="eyebrow">A SAFE PLACE TO PRACTICE</span><h3>가상 돈으로, 투자 습관을 연습하세요.</h3><dl><dt>300개의 가상 기업</dt><dd>한국형 150개·미국형 150개 기업입니다. 실제 기업, 실제 시세, 실제 뉴스와 관계가 없습니다. ETF·코인은 이번 버전에 포함하지 않았습니다.</dd><dt>가상 하루 = 실제 30분</dt><dd>시장은 24시간 진행하며 5초마다 가격을 갱신합니다. 같은 버전과 기기 시간이면 같은 시장 경로를 보여줍니다. 실제 거래소의 휴장·운영 시간을 적용하지 않습니다.</dd><dt>함께 움직이지만, 모두 같지는 않게</dt><dd>시장 공통 흐름, 업종 흐름, 기업별 변동, 변동성 변화, 가상 뉴스 충격을 결합한 결정론적 난수 모형입니다. 실전 수익이나 투자 실력을 예측하는 모형은 아닙니다.</dd><dt>주문과 체결</dt><dd>온주만 거래합니다. 시장가는 확인 시점의 생성 가격으로 전량 체결됩니다. 지정가는 5초 간격의 생성 가격이 조건을 충족할 때 전량 체결되며, 해당 가상 거래일이 끝나면 만료됩니다. 실제 호가·유동성·부분 체결·결제일은 재현하지 않습니다.</dd><dt>자리를 비워도 주문 기록은 이어집니다</dt><dd>창을 닫은 동안의 대기 주문은 다음 로그인에서 유효 기간 안의 5초 간격 가격을 순서대로 확인해 처리합니다. 별도 서버가 실시간으로 주문을 처리하는 구조는 아닙니다.</dd><dt>연습용 비용과 환전</dt><dd>매수·매도 각각 0.05%의 수수료를 최소 1원 또는 1센트 단위로 올림합니다. 환전은 각 방향 0.1%의 스프레드를 적용하고 수령액을 내림합니다. 세금·배당·공매도·신용·레버리지는 포함하지 않습니다.</dd><dt>기기 내 프로필</dt><dd>비밀번호로 암호화한 기록을 이 브라우저에 저장합니다. 서버 계정·자동 동기화·공인 순위 기능은 없으며, 공개 소스를 수정할 수 있어 대회용 부정행위 방지 기능도 제공하지 않습니다. 같은 프로필은 한 탭에서 사용하세요.</dd><dt>비밀번호와 백업</dt><dd>비밀번호를 잊으면 기록을 복구할 수 없습니다. 백업은 암호화된 JSON 파일이며 다른 기기에서 비밀번호와 함께 복원할 수 있습니다. 브라우저 데이터 삭제 전에 백업해주세요.</dd></dl></div>`,true);}
function download(text,filename,type){const url=URL.createObjectURL(new Blob([text],{type})),link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){if(!account()){openAuth();return;}const cell=x=>{let v=String(x??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"';};const rows=[['실제시각','가상시각','코드','기업','구분','통화','수량','체결가','수수료','실현손익','매매일지'],...account().trades.map(t=>[new Date(t.at).toISOString(),simLabel(t.at),t.stockId,STOCK_MAP.get(t.stockId).name,t.side==='buy'?'매수':'매도',t.currency,t.qty,fromMinor(t.priceMinor,t.currency),fromMinor(t.fee,t.currency),fromMinor(t.realized,t.currency),account().journal[t.id]?.text||''])];download('\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),`StockLab-${account().username}-trades.csv`,'text/csv;charset=utf-8');}
function selectStock(id,sell=false){if(!STOCK_MAP.has(id))return;state.selected=id;state.side=sell?'sell':'buy';state.mobilePane='trade';if(state.route!=='market'){location.hash='market';}else render();if(matchMedia('(max-width: 760px)').matches)window.scrollTo({top:0,behavior:'smooth'});}

document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const {action,id,value}=button.dataset;
  if(state.busy && !['range','chart-type','close-modal'].includes(action))return;
  if(action==='auth')openAuth();
  else if(action==='signup')openAuth('signup');
  else if(action==='close-modal')closeModal();
  else if(action==='settings')openSettings();
  else if(action==='rules')openRules();
  else if(action==='exchange')openExchange();
  else if(action==='import')openImport();
  else if(action==='csv')exportCSV();
  else if(action==='select-stock')selectStock(id);
  else if(action==='sell-stock')selectStock(id,true);
  else if(action==='mobile-pane'){state.mobilePane=value;render();if(value==='list')$('#stock-search')?.focus();}
  else if(action==='watch-filter'){if(!account()){openAuth();return;}state.watchOnly=!state.watchOnly;state.page=0;render();}
  else if(action==='watch'){if(!account()){openAuth();return;}await commit(a=>{a.watchlist=a.watchlist.includes(id)?a.watchlist.filter(x=>x!==id):[...a.watchlist,id];return a;});}
  else if(action==='market-filter'){state.market=value;state.page=0;render();}
  else if(action==='page-prev'||action==='page-next'){state.page+=action==='page-prev'?-1:1;renderStockRows();$('#stock-rows').scrollTop=0;}
  else if(action==='range'||action==='chart-type'){if(action==='range')state.range=value;else state.chartType=value;document.querySelectorAll(`[data-action="${action}"]`).forEach(b=>{b.classList.toggle('active',b.dataset.value===value);b.setAttribute('aria-pressed',String(b.dataset.value===value));});$('#stock-chart').innerHTML=candleChart(candles(selected(),state.range,state.now),selected().currency,state.chartType);}
  else if(action==='side'){state.side=value;document.querySelectorAll('[data-action="side"]').forEach(b=>{b.className=b.dataset.value===value?'active '+value:'';b.setAttribute('aria-pressed',String(b.dataset.value===value));});const submit=$('.order-submit');submit.className='order-submit '+value;submit.innerHTML=(account()?(value==='buy'?'매수 주문':'매도 주문'):'로그인하고 모의투자 시작')+' '+icon('arrow');updateEstimate();}
  else if(action==='qty-minus'||action==='qty-plus'){$('#order-qty').value=Math.max(1,Math.min(1000000,Number($('#order-qty').value)+(action==='qty-plus'?1:-1)));updateEstimate();}
  else if(action==='qty-percent'){if(!account()){openAuth();return;}const s=selected(),p=toMinor($('#order-type').value==='limit'?Number($('#limit-price').value):priceAt(s,state.now),s.currency);if(!(p>0))return;let max=state.side==='sell'?availableShares(account(),s.id):Math.floor(availableCash(account(),s.currency)/(p*(1+FEE_RATE)));if(state.side==='buy'&&max*p+feeFor(max*p)>availableCash(account(),s.currency))max--;$('#order-qty').value=Math.max(0,Math.floor(max*Number(value)/100));updateEstimate();}
  else if(action==='cancel-order')await commit(a=>cancelOrder(processOrders(a,Date.now()).account,id),'주문을 취소했습니다.');
  else if(action==='order-help'){state.lesson='orders';closeModal();location.hash='learn';}
  else if(action==='lesson'){state.lesson=id;render();if(matchMedia('(max-width:760px)').matches)$('.lesson-article')?.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(action==='quiz'){state.quiz[id]=Number(value);const l=LESSONS.find(l=>l.id===id);if(Number(value)===l.correct&&account()&&!account().lessons.includes(id))await commit(a=>{a.lessons.push(id);return a;},'학습 완료! 새로운 개념을 익혔어요.');else render();}
  else if(action==='export'){try{download(exportProfile(state.session),`StockLab-${account().username}-${new Date().toISOString().slice(0,10)}.stocklab.json`,'application/json');toast('암호화 백업을 다운로드했습니다. 비밀번호도 기억해주세요.');}catch(e){toast(e.message,true);}}
  else if(action==='logout'){closeModal();state.session=null;state.watchOnly=false;render();toast('로그아웃했습니다. 기록은 이 기기에 저장되어 있습니다.');}
  else if(action==='reset'){showModal('가상 계좌 초기화',`<p class="modal-description">보유 주식, 주문, 거래 내역과 매매일지를 지우고 1,000만 원으로 다시 시작합니다. 관심 종목과 학습 완료 기록은 유지합니다.</p><form id="reset-form"><label class="field-label" for="reset-text">계속하려면 ‘초기화’를 입력해주세요.</label><input id="reset-text" name="confirm" required autocomplete="off"><p class="form-error" id="reset-error"></p><button class="danger full" type="submit">거래 기록을 지우고 다시 시작</button></form>`);}
});
document.addEventListener('input',e=>{if(e.target.id==='stock-search'){state.query=e.target.value;state.page=0;renderStockRows();}if(['order-qty','limit-price'].includes(e.target.id))updateEstimate();if(e.target.id==='fx-amount')updateFxEstimate();});
document.addEventListener('change',e=>{if(e.target.id==='sector-filter'){state.sector=e.target.value;state.page=0;renderStockRows();}if(e.target.id==='stock-sort'){state.sort=e.target.value;state.page=0;renderStockRows();}if(e.target.id==='order-type'){$('#limit-field').hidden=e.target.value!=='limit';updateEstimate();}if(e.target.id==='fx-direction'){const toUSD=e.target.value==='toUSD';$('#fx-amount').value=toUSD?1000000:100;$('#fx-amount').step=toUSD?'1':'.01';$('#fx-amount').min=toUSD?'1':'.01';updateFxEstimate();}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const form=e.target;if(state.busy)return;const data=new FormData(form);
  if(form.id==='auth-form'){
    state.busy=true;const button=form.querySelector('[type="submit"]');button.disabled=true;button.textContent='프로필을 여는 중…';
    try{if(form.dataset.mode==='signup'&&data.get('password')!==data.get('confirm'))throw new Error('비밀번호 확인이 일치하지 않습니다.');const session=await(form.dataset.mode==='signup'?createProfile:loginProfile)(data.get('username'),data.get('password'));const result=processOrders(session.account,Date.now());snapshot(result.account);await saveProfile(session,result.account);state.session=session;state.busy=false;closeModal();render();toast(`${session.account.username}님, 투자 실험실에 오신 것을 환영합니다.${result.changed?' 대기 주문도 처리했습니다.':''}`);}catch(error){state.busy=false;$('#auth-error').textContent=error.message;button.disabled=false;button.textContent=form.dataset.mode==='signup'?'1,000만 원으로 시작하기':'내 투자 기록 열기';}
  }else if(form.id==='order-form'){
    if(!account()){openAuth('signup');return;}let order;const success=await commit(a=>{const result=placeOrder(a,{stockId:state.selected,side:state.side,type:data.get('type'),qty:Number(data.get('qty')),limitPrice:Number(data.get('limitPrice'))},Date.now());order=result.order;return result.account;});if(success)toast(order.status==='filled'?`${STOCK_MAP.get(order.stockId).name} ${num(order.qty)}주 ${order.side==='buy'?'매수':'매도'}가 체결되었습니다.`:'지정가 주문을 등록했습니다. 내 자산에서 확인하세요.');
  }else if(form.id==='exchange-form'){
    const success=await commit(a=>exchange(processOrders(a,Date.now()).account,data.get('direction'),Number(data.get('amount')),Date.now()),'가상 환전을 완료했습니다.');if(success)closeModal();
  }else if(form.classList.contains('journal-form')){
    await commit(a=>{a.journal[form.dataset.tradeId]={text:String(data.get('text')).slice(0,2000),feeling:data.get('feeling'),updatedAt:Date.now()};return a;},'매매일지를 저장했습니다.');
  }else if(form.id==='import-form'){
    const file=$('#backup-file').files[0];if(!file)return;if(file.size>10000000){$('#import-error').textContent='10MB 이하의 백업 파일을 선택해주세요.';return;}state.busy=true;const button=form.querySelector('[type="submit"]');button.disabled=true;
    try{const session=await importProfile(await file.text(),data.get('password'),data.get('replace')==='on');const result=processOrders(session.account,Date.now());snapshot(result.account);await saveProfile(session,result.account);state.session=session;state.busy=false;closeModal();render();toast('백업을 복원했습니다. 이 기기에서 이어서 연습할 수 있습니다.');}catch(error){state.busy=false;$('#import-error').textContent=error.message;button.disabled=false;}
  }else if(form.id==='reset-form'){
    if(data.get('confirm')!=='초기화'){$('#reset-error').textContent='‘초기화’를 정확히 입력해주세요.';return;}const success=await commit(a=>{const next=newAccount(a.username);next.watchlist=a.watchlist;next.lessons=a.lessons;return next;},'1,000만 원으로 새롭게 시작합니다.');if(success)closeModal();
  }
});
$('#modal').addEventListener('cancel',e=>{if(state.busy)e.preventDefault();else document.body.classList.remove('modal-open');});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
window.addEventListener('hashchange',()=>{state.route=nav.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'market';render();window.scrollTo({top:0,behavior:'instant'});});
window.addEventListener('storage',e=>{if(state.session&&(e.key===null||isProfileKey(e.key)&&e.key.endsWith('.'+account().username))){state.session=null;state.watchOnly=false;state.busy=false;closeModal();render();toast('다른 탭에서 프로필이 변경되었습니다. 다시 로그인해주세요.',true);}});
async function tick(){
  state.now=Date.now();for(const selector of ['#market-clock','#mobile-market-clock'])if($(selector))$(selector).innerHTML=clockMarkup();if(state.busy)return;
  const tick=Math.floor(state.now/TICK_MS);if(tick===state.lastTick)return;state.lastTick=tick;
  if(account()){
    const result=processOrders(account(),state.now);
    if(result.changed){await commit(()=>result.account,'대기 주문의 체결·만료 상태가 업데이트되었습니다.');return;}
    if(state.now-state.lastSnapshot>60000&&!$('#modal').open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
      state.lastSnapshot=state.now;await commit(a=>{snapshot(a,state.now);return a;});
    }
  }
  if(state.route==='market'){
    document.querySelectorAll('[data-live-price]').forEach(el=>{const s=STOCK_MAP.get(el.dataset.livePrice);el.textContent=money(priceAt(s,state.now),s.currency);});
    document.querySelectorAll('[data-live-change]').forEach(el=>{const q=quote(STOCK_MAP.get(el.dataset.liveChange),state.now);el.textContent=pct(q.change);el.className=signClass(q.change);});
    if($('#stock-chart'))$('#stock-chart').innerHTML=candleChart(candles(selected(),state.range,state.now),selected().currency,state.chartType);
    if($('#index-cards'))$('#index-cards').innerHTML=indexCards();if($('#news-list'))$('#news-list').innerHTML=newsMarkup();updateEstimate();
  }else if(state.route==='portfolio'&&!$('#modal').open&&!['INPUT','SELECT'].includes(document.activeElement?.tagName))render();
  if($('#fx-estimate'))updateFxEstimate();
}
state.route=nav.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'market';
render();setInterval(()=>tick().catch(e=>toast(e.message,true)),1000);

return {};
})();

</script>
</body>
</html>
